<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" fill="none">
  <defs>
    <!-- Ambient blue halo -->
    <radialGradient id="blueHalo" cx="50%" cy="46%" r="44%">
      <stop offset="0%" stop-color="#1F4BFF" stop-opacity="0.34"/>
      <stop offset="48%" stop-color="#1F4BFF" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#090C12" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft warm rim glow on right -->
    <radialGradient id="warmRim" cx="68%" cy="42%" r="36%">
      <stop offset="0%" stop-color="#FFB347" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090C12" stop-opacity="0"/>
    </radialGradient>

    <!-- Chrome pill gradient -->
    <linearGradient id="chromePill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#DDE6F0"/>
      <stop offset="68%" stop-color="#5B677B"/>
      <stop offset="100%" stop-color="#141B26"/>
    </linearGradient>

    <!-- Glass pill gradient -->
    <linearGradient id="glassPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#DDE6F0" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#1F4BFF" stop-opacity="0.16"/>
    </linearGradient>

    <!-- Graphite phone body -->
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#273142"/>
      <stop offset="18%" stop-color="#121823"/>
      <stop offset="82%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#2E3645"/>
    </linearGradient>

    <!-- Phone bezel sheen -->
    <linearGradient id="phoneBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDE6F0" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#9AA6B8" stop-opacity="0.14"/>
      <stop offset="72%" stop-color="#9AA6B8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFB347" stop-opacity="0.32"/>
    </linearGradient>

    <!-- Screen surface -->
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1420"/>
      <stop offset="100%" stop-color="#090C12"/>
    </linearGradient>

    <!-- Ring halo bloom -->
    <filter id="ringBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#020408" flood-opacity="0.72"/>
    </filter>
  </defs>

  <!-- Background ambient glow -->
  <circle cx="600" cy="460" r="460" fill="url(#blueHalo)"/>
  <circle cx="660" cy="430" r="360" fill="url(#warmRim)"/>

  <!-- Outer technical dashed orbit rings -->
  <circle cx="600" cy="455" r="375" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="4 10"/>
  <circle cx="600" cy="455" r="245" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="2 8"/>

  <!-- White torus ring halo behind phone -->
  <circle cx="600" cy="455" r="298" stroke="#EAF0F6" stroke-opacity="0.38" stroke-width="4" filter="url(#ringBloom)"/>
  <circle cx="600" cy="455" r="298" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="1.5"/>

  <!-- Back helix strand (behind phone) -->
  <g opacity="0.88">
    <!-- Top-left to bottom-right wave behind -->
    <g transform="translate(362 195) rotate(-28)">
      <rect x="-26" y="-10" width="52" height="20" rx="10" fill="url(#glassPill)" stroke="#DDE6F0" stroke-opacity="0.32"/>
    </g>
    <g transform="translate(425 245) rotate(-18)">
      <rect x="-28" y="-11" width="56" height="22" rx="11" fill="url(#chromePill)"/>
    </g>
    <g transform="translate(795 275) rotate(22)">
      <rect x="-26" y="-10" width="52" height="20" rx="10" fill="url(#glassPill)" stroke="#5CF2C7" stroke-opacity="0.5"/>
      <circle cx="12" cy="0" r="4" fill="#5CF2C7" filter="url(#softGlow)"/>
      <circle cx="12" cy="0" r="3.5" fill="#5CF2C7"/>
    </g>
    <g transform="translate(845 360) rotate(32)">
      <rect x="-28" y="-10" width="56" height="20" rx="10" fill="url(#chromePill)"/>
    </g>
    <g transform="translate(350 560) rotate(-32)">
      <rect x="-26" y="-10" width="52" height="20" rx="10" fill="url(#chromePill)"/>
    </g>
    <g transform="translate(390 645) rotate(-20)">
      <rect x="-28" y="-10" width="56" height="20" rx="10" fill="url(#glassPill)" stroke="#FFB347" stroke-opacity="0.5"/>
      <circle cx="-12" cy="0" r="3.5" fill="#FFB347"/>
    </g>
    <g transform="translate(815 620) rotate(26)">
      <rect x="-26" y="-10" width="52" height="20" rx="10" fill="url(#glassPill)" stroke="#DDE6F0" stroke-opacity="0.32"/>
    </g>
    <g transform="translate(755 695) rotate(14)">
      <rect x="-28" y="-11" width="56" height="22" rx="11" fill="url(#chromePill)"/>
    </g>
  </g>

  <!-- Central Phone (Dark Graphite Chrome) -->
  <g transform="translate(600 455) rotate(-4)" filter="url(#cardShadow)">
    <!-- Side hardware buttons -->
    <rect x="-157" y="-152" width="4" height="32" rx="2" fill="#5B677B"/>
    <rect x="-157" y="-104" width="4" height="52" rx="2" fill="#5B677B"/>
    <rect x="-157" y="-42" width="4" height="52" rx="2" fill="#5B677B"/>
    <rect x="153" y="-112" width="4" height="68" rx="2" fill="#707D91"/>

    <!-- Phone chassis -->
    <rect x="-154" y="-305" width="308" height="610" rx="44" fill="url(#phoneBody)" stroke="url(#phoneBezel)" stroke-width="2"/>
    <!-- Inner bezel -->
    <rect x="-142" y="-293" width="284" height="586" rx="34" fill="url(#screenBg)" stroke="#FFFFFF" stroke-opacity="0.06"/>

    <!-- Dynamic Island / camera pill -->
    <rect x="-42" y="-276" width="84" height="20" rx="10" fill="#05070B" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="24" cy="-266" r="4" fill="#182236"/>
    <circle cx="24" cy="-266" r="1.5" fill="#5CF2C7" opacity="0.65"/>

    <!-- Screen Content: MedBuddy Cabinet (Illustrative) -->
    <!-- Status & Illustrative tag -->
    <text x="-118" y="-230" fill="#9AA6B8" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.6">MEDBUDDY CABINET</text>
    <rect x="44" y="-242" width="74" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="81" y="-230" text-anchor="middle" fill="#9AA6B8" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1">ILLUSTRATIVE</text>

    <!-- Screen Title -->
    <text x="-118" y="-194" fill="#EAF0F6" font-family="Georgia, serif" font-size="28">Home Cabinet</text>
    <text x="-118" y="-172" fill="#9AA6B8" font-family="system-ui, sans-serif" font-size="12">Sorted by expiry &amp; opened date</text>

    <!-- Summary pill strip -->
    <rect x="-118" y="-152" width="72" height="26" rx="13" fill="#5CF2C7" fill-opacity="0.12" stroke="#5CF2C7" stroke-opacity="0.35"/>
    <circle cx="-104" cy="-139" r="3.5" fill="#5CF2C7"/>
    <text x="-94" y="-135" fill="#EAF0F6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">6 Safe</text>

    <rect x="-38" y="-152" width="78" height="26" rx="13" fill="#FFB347" fill-opacity="0.12" stroke="#FFB347" stroke-opacity="0.35"/>
    <circle cx="-24" cy="-139" r="3.5" fill="#FFB347"/>
    <text x="-14" y="-135" fill="#EAF0F6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">2 Soon</text>

    <rect x="48" y="-152" width="72" height="26" rx="13" fill="#FF4D6A" fill-opacity="0.14" stroke="#FF4D6A" stroke-opacity="0.45"/>
    <circle cx="62" cy="-139" r="3.5" fill="#FF4D6A"/>
    <text x="72" y="-135" fill="#EAF0F6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">1 Past</text>

    <!-- Card 1: In date (OK) -->
    <rect x="-118" y="-108" width="236" height="90" rx="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <circle cx="-94" cy="-76" r="10" fill="#5CF2C7" fill-opacity="0.15" stroke="#5CF2C7" stroke-opacity="0.7"/>
    <path d="M-98 -76 L-95 -73 L-89 -79" stroke="#5CF2C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="-74" y="-73" fill="#EAF0F6" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Metformin 500 mg</text>
    <text x="-74" y="-54" fill="#9AA6B8" font-family="system-ui, sans-serif" font-size="11.5">Kitchen shelf · 42 tablets left</text>
    <text x="-102" y="-32" fill="#5CF2C7" font-family="ui-monospace, monospace" font-size="10" letter-spacing="0.8">IN DATE · 148 DAYS</text>

    <!-- Card 2: Use soon (WARN) -->
    <rect x="-118" y="-4" width="236" height="90" rx="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFB347" stroke-opacity="0.28"/>
    <circle cx="-94" cy="28" r="10" fill="#FFB347" fill-opacity="0.15" stroke="#FFB347" stroke-opacity="0.8"/>
    <path d="M-94 23 V29 M-94 32.5 V33" stroke="#FFB347" stroke-width="1.8" stroke-linecap="round"/>
    <text x="-74" y="31" fill="#EAF0F6" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Eye Drops (Opened)</text>
    <text x="-74" y="50" fill="#9AA6B8" font-family="system-ui, sans-serif" font-size="11.5">Bedside · Opened 18d ago</text>
    <text x="-102" y="72" fill="#FFB347" font-family="ui-monospace, monospace" font-size="10" letter-spacing="0.8">USE SOON · 10 DAYS LEFT</text>

    <!-- Card 3: Expired (ALERT) -->
    <rect x="-118" y="100" width="236" height="90" rx="18" fill="#FF4D6A" fill-opacity="0.08" stroke="#FF4D6A" stroke-opacity="0.45"/>
    <circle cx="-94" cy="132" r="10" fill="#FF4D6A" fill-opacity="0.2" stroke="#FF4D6A"/>
    <path d="M-97.5 128.5 L-90.5 135.5 M-90.5 128.5 L-97.5 135.5" stroke="#FF4D6A" stroke-width="1.8" stroke-linecap="round"/>
    <text x="-74" y="135" fill="#EAF0F6" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Cough Syrup</text>
    <text x="-74" y="154" fill="#9AA6B8" font-family="system-ui, sans-serif" font-size="11.5">Bathroom · Safe disposal ready</text>
    <text x="-102" y="176" fill="#FF4D6A" font-family="ui-monospace, monospace" font-size="10" letter-spacing="0.8">EXPIRED · 3 DAYS AGO</text>

    <!-- Bottom dock bar -->
    <rect x="-118" y="210" width="236" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <rect x="-108" y="218" width="106" height="36" rx="18" fill="#EAF0F6"/>
    <text x="-55" y="240" text-anchor="middle" fill="#090C12" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Log dose</text>
    <text x="58" y="240" text-anchor="middle" fill="#EAF0F6" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Scan strip</text>
  </g>

  <!-- Foreground helix capsules (crossing in front of phone & ring) -->
  <g>
    <!-- Upper arc -->
    <g transform="translate(500 185) rotate(-8)">
      <rect x="-32" y="-12" width="64" height="24" rx="12" fill="url(#chromePill)"/>
      <line x1="0" y1="-11" x2="0" y2="11" stroke="#090C12" stroke-opacity="0.35" stroke-width="1.5"/>
    </g>
    <g transform="translate(615 162) rotate(12)">
      <rect x="-32" y="-12" width="64" height="24" rx="12" fill="url(#glassPill)" stroke="#DDE6F0" stroke-opacity="0.45"/>
      <circle cx="14" cy="0" r="4" fill="#5CF2C7"/>
    </g>
    <g transform="translate(722 204) rotate(24)">
      <rect x="-30" y="-11" width="60" height="22" rx="11" fill="url(#chromePill)"/>
    </g>

    <!-- Mid diagonal sweep -->
    <g transform="translate(390 365) rotate(-26)">
      <rect x="-34" y="-13" width="68" height="26" rx="13" fill="url(#glassPill)" stroke="#FFFFFF" stroke-opacity="0.42"/>
      <rect x="-24" y="-7" width="22" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.45"/>
    </g>
    <g transform="translate(838 492) rotate(22)">
      <rect x="-34" y="-13" width="68" height="26" rx="13" fill="url(#glassPill)" stroke="#FF4D6A" stroke-opacity="0.65"/>
      <circle cx="15" cy="0" r="6" fill="#FF4D6A" filter="url(#softGlow)"/>
      <circle cx="15" cy="0" r="4.5" fill="#FF4D6A"/>
    </g>
    <g transform="translate(338 455) rotate(-14)">
      <rect x="-26" y="-10" width="52" height="20" rx="10" fill="url(#chromePill)"/>
    </g>

    <!-- Lower sweep -->
    <g transform="translate(472 715) rotate(-12)">
      <rect x="-32" y="-12" width="64" height="24" rx="12" fill="url(#glassPill)" stroke="#DDE6F0" stroke-opacity="0.4"/>
    </g>
    <g transform="translate(592 746) rotate(4)">
      <rect x="-34" y="-13" width="68" height="26" rx="13" fill="url(#chromePill)"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#090C12" stroke-opacity="0.35" stroke-width="1.5"/>
    </g>
    <g transform="translate(708 728) rotate(18)">
      <rect x="-30" y="-11" width="60" height="22" rx="11" fill="url(#glassPill)" stroke="#FFB347" stroke-opacity="0.55"/>
      <circle cx="-12" cy="0" r="4" fill="#FFB347"/>
    </g>
  </g>

  <!-- Fine spec leader lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1">
    <line x1="255" y1="290" x2="365" y2="290"/>
    <circle cx="365" cy="290" r="2.5" fill="#DDE6F0"/>
    <line x1="835" y1="535" x2="945" y2="535"/>
    <circle cx="835" cy="535" r="2.5" fill="#FF4D6A"/>
  </g>
</svg>
